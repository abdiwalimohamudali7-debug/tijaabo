<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskPomo - Focus Timer</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101114;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}
.app{max-width:500px;margin:auto}
h1{text-align:center;font-size:27px}
.subtitle{text-align:center;color:#aaa}
.card{
  background:#1b1c22;
  padding:20px;
  border-radius:22px;
  margin:18px 0;
}
.tabs{display:flex;gap:6px}
button{
  cursor:pointer;
  border:0;
  border-radius:12px;
  padding:12px;
  font-weight:bold;
}
.tabs button{
  flex:1;background:#30313a;color:white;
}
.tabs button.active{background:#f04452}
.timer{
  width:240px;height:240px;
  margin:25px auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:conic-gradient(#f04452 var(--progress,100%),#393a42 0);
}
.inner{
  width:215px;height:215px;
  border-radius:50%;
  background:#1b1c22;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
#time{font-size:52px;font-weight:bold}
#mode{color:#aaa;margin-top:8px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.primary{background:#f04452;color:white}
.secondary{background:#30313a;color:white}
.settings{margin-top:20px;color:#bbb;text-align:center}
input{
  padding:12px;border-radius:10px;
  background:#101114;color:white;
  border:1px solid #444;
}
.settings input{width:55px}
#taskInput{width:70%}
.taskrow{display:flex;gap:7px}
.taskrow button{background:#32cf83}
ul{padding:0;list-style:none}
li{
  display:flex;align-items:center;gap:10px;
  padding:12px 0;border-bottom:1px solid #383941;
}
li span{flex:1;overflow-wrap:anywhere}
li.done span{text-decoration:line-through;color:#888}
.delete{background:transparent;color:#ff6975;font-size:20px}
.stats{display:flex;justify-content:space-around;text-align:center}
.stats strong{display:block;font-size:25px}
.stats small{color:#aaa}
</style>
</head>

<body>
<div class="app">
  <h1>🍅 TaskPomo</h1>
  <p class="subtitle">Focus Timer & Tasks</p>

  <div class="card">
    <div class="tabs">
      <button class="active" data-mode="focus">🎯 Focus</button>
      <button data-mode="short">☕ Nasasho</button>
      <button data-mode="long">🌿 Nasasho dheer</button>
    </div>

    <div class="timer" id="ring">
      <div class="inner">
        <div id="time">25:00</div>
        <div id="mode">Waqtiga waxbarashada</div>
      </div>
    </div>

    <div class="controls">
      <button class="primary" id="start">▶ Bilow</button>
      <button class="secondary" id="reset">↻ Dib u bilow</button>
      <button class="secondary" id="skip">⏭ Ka gudub</button>
    </div>

    <div class="settings">
      Focus <input id="focusMin" type="number" value="25" min="1" max="180">
      Nasasho <input id="breakMin" type="number" value="5" min="1" max="60">
    </div>
    <p style="text-align:center;color:#aaa;font-size:12px">
      🔔 Gambaleel ayaa dhacaya marka waqtigu dhammaado.
    </p>
  </div>

  <div class="card">
    <h3>📝 Hawlahayga</h3>
    <form class="taskrow" id="taskForm">
      <input id="taskInput" placeholder="Qor hawshaada..." required>
      <button type="submit">+ Ku dar</button>
    </form>
    <ul id="tasks"></ul>
  </div>

  <div class="card">
    <h3>📊 Horumarka maanta</h3>
    <div class="stats">
      <div><strong id="sessions">0</strong><small>Focus dhammaaday</small></div>
      <div><strong id="completed">0</strong><small>Hawl dhammaatay</small></div>
      <div><strong id="minutes">0</strong><small>Daqiiqo</small></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

const modes = {
  focus:{label:"Waqtiga waxbarashada",minutes:25},
  short:{label:"Nasasho gaaban",minutes:5},
  long:{label:"Nasasho dheer",minutes:15}
};

let mode="focus";
let total=1500;
let remaining=1500;
let running=false;
let interval=null;
let sessions=0;
let minutes=0;
let tasks=[];

function display(){
  const m=Math.floor(remaining/60);
  const s=remaining%60;

  $("time").textContent=
    String(m).padStart(2,"0")+":"+
    String(s).padStart(2,"0");

  $("mode").textContent=modes[mode].label;

  $("ring").style.setProperty(
    "--progress",(remaining/total*100)+"%"
  );

  $("start").textContent=running?"⏸ Hakad geli":"▶ Bilow";
  document.title=$("time").textContent+" - TaskPomo";
}

function stop(){
  running=false;
  clearInterval(interval);
  interval=null;
  display();
}

function selectMode(newMode){
  stop();
  mode=newMode;

  let mins;
  if(mode==="focus") mins=Number($("focusMin").value);
  else if(mode==="short") mins=Number($("breakMin").value);
  else mins=15;

  mins=Math.max(1,mins||1);
  total=mins*60;
  remaining=total;

  document.querySelectorAll("[data-mode]").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.mode===mode);
  });

  display();
}

function alarm(){
  try{
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass){
      alert("🔔 Waqtigu wuu dhammaaday!");
      return;
    }

    const ctx=new AudioContextClass();

    [0,0.35,0.7,1.05].forEach((delay,i)=>{
      const oscillator=ctx.createOscillator();
      const gain=ctx.createGain();

      oscillator.type="sine";
      oscillator.frequency.value=i%2===0?880:660;

      gain.gain.setValueAtTime(0.001,ctx.currentTime+delay);
      gain.gain.exponentialRampToValueAtTime(
        0.4,ctx.currentTime+delay+0.03
      );
      gain.gain.exponentialRampToValueAtTime(
        0.001,ctx.currentTime+delay+0.25
      );

      oscillator.connect(gain);
      gain.connect(ctx.destination);

      oscillator.start(ctx.currentTime+delay);
      oscillator.stop(ctx.currentTime+delay+0.28);
    });

    setTimeout(()=>ctx.close(),1800);
  }catch(error){
    alert("🔔 Waqtigu wuu dhammaaday!");
  }
}

function tick(){
  if(remaining>0) remaining--;
  display();

  if(remaining<=0){
    const finishedMode=mode;
    stop();
    alarm();

    if(finishedMode==="focus"){
      sessions++;
      minutes+=Math.round(total/60);

      $("sessions").textContent=sessions;
      $("minutes").textContent=minutes;

      selectMode(sessions%4===0?"long":"short");
      alert("Focus waa dhammaaday! Waa waqtigii nasashada.");
    }else{
      selectMode("focus");
      alert("Nasashadu way dhammaatay! Ku noqo hawshaada.");
    }
  }
}

$("start").addEventListener("click",async()=>{
  if(running){
    stop();
    return;
  }

  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){
      const ctx=new AC();
      await ctx.resume();
      await ctx.close();
    }
  }catch(e){}

  running=true;
  display();
  interval=setInterval(tick,1000);
});

$("reset").addEventListener("click",()=>{
  stop();
  remaining=total;
  display();
});

$("skip").addEventListener("click",()=>{
  selectMode(mode==="focus"?"short":"focus");
});

document.querySelectorAll("[data-mode]").forEach(btn=>{
  btn.addEventListener("click",()=>selectMode(btn.dataset.mode));
});

$("focusMin").addEventListener("change",()=>{
  if(mode==="focus")selectMode("focus");
});

$("breakMin").addEventListener("change",()=>{
  if(mode==="short")selectMode("short");
});

// Hawlaha
function renderTasks(){
  const list=$("tasks");
  list.innerHTML="";

  tasks.forEach(task=>{
    const li=document.createElement("li");
    li.className=task.done?"done":"";

    const checkbox=document.createElement("input");
    checkbox.type="checkbox";
    checkbox.checked=task.done;

    checkbox.addEventListener("change",()=>{
      task.done=checkbox.checked;
      renderTasks();
    });

    const span=document.createElement("span");
    span.textContent=task.text;

    const del=document.createElement("button");
    del.className="delete";
    del.textContent="×";

    del.addEventListener("click",()=>{
      tasks=tasks.filter(t=>t.id!==task.id);
      renderTasks();
    });

    li.append(checkbox,span,del);
    list.appendChild(li);
  });

  $("completed").textContent=tasks.filter(t=>t.done).length;
}

$("taskForm").addEventListener("submit",event=>{
  event.preventDefault();

  const input=$("taskInput");
  const text=input.value.trim();

  if(!text)return;

  tasks.push({
    id:Date.now()+Math.random(),
    text:text,
    done:false
  });

  input.value="";
  renderTasks();
});

display();
renderTasks();
</script>
</body>
</html>
