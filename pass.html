<!DOCTYPE html>
<html lang="so">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abuuraha Furaha (Password Generator)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@500;600&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #053352;
        }

        .mono-font {
            font-family: 'Fira Code', monospace;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Card-ka Weyn -->
    <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl shadow-sm p-6 sm:p-8 space-y-6">

        <!-- Cinwaanka -->
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">
                password Generator
            </h1>
            <p class="text-sm text-gray-500">
              hadii aad rabto kan isticmaal
            </p>
        </div>

        <!-- Qaybta Input-ka iyo Badhanka Nuukso -->
        <div class="space-y-2">
            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">
                 (Password):
            </label>
            <div class="flex gap-2">
                <input type="text" id="password-field" readonly placeholder="Riix badhanka si aad u abuurto"
                    class="w-full bg-gray-50 border border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl px-4 py-3 text-lg font-semibold text-gray-800 mono-font text-center select-all outline-none transition-all" />
                <button onclick="copyPassword()" title="Nuukso (Copy)"
                    class="bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 font-medium px-4 py-3 rounded-xl border border-gray-300 transition-colors flex items-center justify-center shrink-0">
                   coppy
                </button>
            </div>
        </div>

        <!-- Badhanka Weyn oo lagu Abuurayo Password-ka -->
        <button onclick="generatePassword()"
            class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3.5 px-6 rounded-xl shadow-sm transition-colors text-base text-center">
           generatePassword
        </button>

        <!-- Cabbirka Furaha (Sizing Option) -->
        <div class="pt-4 border-t border-gray-100 flex items-center justify-between text-sm text-gray-600">
            <span>inta oo password noqanaayo:</span>
            <div class="flex items-center gap-3">
                <input type="range" id="length-slider" min="8" max="32" value="4" oninput="updateLength(this.value)"
                    class="w-28 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600" />
                <span id="length-val" class="font-semibold text-blue-600 mono-font w-6 text-right">4</span>
            </div>
        </div>

        <!-- Fariinta Guusha (Toast Notification) -->
        <div id="message-box"
            class="hidden text-center text-xs font-medium text-emerald-700 bg-emerald-50 border border-emerald-200 p-2.5 rounded-lg transition-all">
        password waad coppy yeesay (Coppy)!
        </div>

    </div>

    <!-- JavaScript-ka Koodka -->
    <script>
        let pwdLength = 4;
        const passwordInput = document.getElementById('password-field');
        const lengthVal = document.getElementById('length-val');
        const messageBox = document.getElementById('message-box');

        // Shaqada lagu abuurayo Password adag
        function generatePassword() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=";
            const array = new Uint32Array(pwdLength);
            window.crypto.getRandomValues(array);

            let result = "";
            for (let i = 0; i < pwdLength; i++) {
                result += chars[array[i] % chars.length];
            }

            passwordInput.value = result;
        }

        // Isbeddelka dhererka furaha
        function updateLength(val) {
            pwdLength = parseInt(val);
            lengthVal.innerText = pwdLength;
            generatePassword();
        }

        // Shaqada Nuukso (Copy)
        function copyPassword() {
            if (!passwordInput.value) return;

            // Isticmaal textarea Ktemporary ah si uu si ammaan ah ugu shaqeeyo iFrame-yada
            const tempArea = document.createElement('textarea');
            tempArea.value = passwordInput.value;
            tempArea.style.position = 'fixed';
            tempArea.style.opacity = '0';
            document.body.appendChild(tempArea);
            tempArea.select();

            try {
                document.execCommand('copy');
                showMessage();
            } catch (err) {
                console.error("Nuuksashadu ma suurtogalin", err);
            } finally {
                document.body.removeChild(tempArea);
            }
        }

        // Muujinta Fariinta Nuuksashada
        let timer;
        function showMessage() {
            messageBox.classList.remove('hidden');
            clearTimeout(timer);
            timer = setTimeout(() => {
                messageBox.classList.add('');
            }, 2000);
        }

        // Marka bogga la furo markiiba abuur password
        window.onload = function () {
            generatePassword();
        };
    </script>
</body>

</html>
