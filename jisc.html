<body>

    <div class="container">
        <!-- Circular Timer -->
        <div class="circle-container">
            <svg class="circle-svg" viewBox="0 0 280 280">
                <circle class="circle-bg" cx="140" cy="140" r="130"></circle>
                <circle id="progress" class="circle-progress" cx="140" cy="140" r="130"></circle>
            </svg>
            <div class="timer-display">
                <div id="time-display" class="time-text">25:00</div>
                <div id="mode-display" class="mode-text">Focus</div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="controls">
            <button id="start-btn" onclick="toggleTimer()" class="btn btn-primary">
                <i id="start-icon" class="fa-solid fa-play"></i>
                <span id="start-text">Bilow</span>
            </button>
            <button onclick="resetTimer()" class="btn btn-secondary">
                <i class="fa-solid fa-rotate-left"></i>
                <span>Dib u bilow</span>
            </button>
            <button onclick="skipMode()" class="btn btn-secondary">
                <i class="fa-solid fa-forward-step"></i>
                <span>Ka gudub</span>
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const timeDisplay = document.getElementById('time-display');
        const modeDisplay = document.getElementById('mode-display');
        const progressCircle = document.getElementById('progress');
        const startIcon = document.getElementById('start-icon');
        const startText = document.getElementById('start-text');

        // State Variables
        let isRunning = false;
        let isFocusMode = true;
        let timer = null;
        let focusSeconds = 0.5 * 60; // 25 daqiiqad
        let breakSeconds = 5 * 60;  // 5 daqiiqad nasasho ah
        let totalSeconds = focusSeconds;
        let remainingSeconds = focusSeconds;
        let audioCtx = null;

        const CIRCUMFERENCE = 2 * Math.PI * 130; // 816.8

        function getAudioContext() {
            if (!audioCtx) {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                if (AudioCtxClass) {
                    audioCtx = new AudioCtxClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Dhawaaqa marka waqtigu dhammaado (soconaya 5 ilbiriqsi)
        function playAlarmSound() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const totalDuration = 5000;
                const intervalTime = 500;
                let elapsed = 0;

                function playTone() {
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }

                playTone();
                const soundInterval = setInterval(() => {
                    elapsed += intervalTime;
                    if (elapsed >= totalDuration) {
                        clearInterval(soundInterval);
                    } else {
                        playTone();
                    }
                }, intervalTime);
            } catch (e) {
                console.log("Audio error:", e);
            }
        }

        function toggleTimer() {
            getAudioContext();
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            isRunning = true;
            startIcon.className = 'fa-solid fa-pause';
            startText.innerText = 'Jooji';

            timer = setInterval(() => {
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    render();
                } else {
                    clearInterval(timer);
                    isRunning = false;
                    startIcon.className = 'fa-solid fa-play';
                    startText.innerText = 'Bilow';
                    playAlarmSound();
                    skipMode();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timer);
            startIcon.className = 'fa-solid fa-play';
            startText.innerText = 'Bilow';
        }

        function resetTimer() {
            pauseTimer();
            remainingSeconds = totalSeconds;
            render();
        }

        function skipMode() {
            pauseTimer();
            isFocusMode = !isFocusMode;
            if (isFocusMode) {
                modeDisplay.innerText = "Focus";
                totalSeconds = focusSeconds;
            } else {
                modeDisplay.innerText = "Nasasho gaaban";
                totalSeconds = breakSeconds;
            }
            remainingSeconds = totalSeconds;
            render();
        }

        function render() {
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;

            const formattedMins = String(mins).padStart(2, '0');
            const formattedSecs = String(secs).padStart(2, '0');

            timeDisplay.innerText = `${formattedMins}:${formattedSecs}`;

            const progressRatio = totalSeconds > 0 ? (remainingSeconds / totalSeconds) : 0;
            const offset = CIRCUMFERENCE * (1 - progressRatio);
            progressCircle.style.strokeDashoffset = offset;
        }

        // Initial render
        render();
    </script>
</body>
</html>
